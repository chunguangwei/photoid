<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景主渐变：四段停靠，中段提亮，避免大面积平涂的廉价感 -->
    <linearGradient id="bg" x1="120" y1="80" x2="904" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9BEF3"/>
      <stop offset=".38" stop-color="#8199DE"/>
      <stop offset=".72" stop-color="#6A81C9"/>
      <stop offset="1" stop-color="#54679F"/>
    </linearGradient>
    <!-- 左上柔光：模拟单一光源，是「微立体」的根 -->
    <radialGradient id="sheen" cx="0" cy="0" r="1"
      gradientTransform="translate(300 232) rotate(52) scale(660)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 右下暗角：把体积压回去，形成明暗对比 -->
    <radialGradient id="vignette" cx="0" cy="0" r="1"
      gradientTransform="translate(820 860) rotate(-135) scale(720)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E3C6B" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2E3C6B" stop-opacity="0"/>
    </radialGradient>
    <!-- 取景框：白色微渐变，上亮下沉 -->
    <linearGradient id="frame" x1="300" y1="280" x2="740" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EBFA"/>
    </linearGradient>
    <!-- 头像块：顶部纯白 → 底部冷灰，制造球面感 -->
    <linearGradient id="face" x1="430" y1="430" x2="600" y2="712" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#F7F9FE"/>
      <stop offset="1" stop-color="#E2E9F8"/>
    </linearGradient>
    <!-- 徽章：粉红球体渐变 -->
    <linearGradient id="badge" x1="632" y1="620" x2="694" y2="686" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF97A0"/>
      <stop offset=".55" stop-color="#FF7180"/>
      <stop offset="1" stop-color="#EF4E63"/>
    </linearGradient>
    <!-- 元素投影：低透明、大扩散，克制不脏 -->
    <filter id="lift" x="120" y="180" width="820" height="760" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1F2C55" flood-opacity=".22"/>
    </filter>
    <filter id="liftSm" x="560" y="540" width="240" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#7A1E33" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>
