<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景主渐变：四段停靠，中段提亮，避免大面积平涂的廉价感 -->
    <linearGradient id="bg" x1="120" y1="80" x2="904" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9BEF3"/>
      <stop offset=".38" stop-color="#8199DE"/>
      <stop offset=".72" stop-color="#6A81C9"/>
      <stop offset="1" stop-color="#54679F"/>
    </linearGradient>
    <!-- 左上柔光：模拟单一光源，是「微立体」的根 -->
    <radialGradient id="sheen" cx="0" cy="0" r="1"
      gradientTransform="translate(300 232) rotate(52) scale(660)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 右下暗角：把体积压回去，形成明暗对比 -->
    <radialGradient id="vignette" cx="0" cy="0" r="1"
      gradientTransform="translate(820 860) rotate(-135) scale(720)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E3C6B" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2E3C6B" stop-opacity="0"/>
    </radialGradient>
    <!-- 取景框：白色微渐变，上亮下沉 -->
    <linearGradient id="frame" x1="300" y1="280" x2="740" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EBFA"/>
    </linearGradient>
    <!-- 头像块：顶部纯白 → 底部冷灰，制造球面感 -->
    <linearGradient id="face" x1="430" y1="430" x2="600" y2="712" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#F7F9FE"/>
      <stop offset="1" stop-color="#D8E1F4"/>
    </linearGradient>
    <!-- 徽章：粉红球体渐变 -->
    <linearGradient id="badge" x1="632" y1="620" x2="694" y2="686" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF97A0"/>
      <stop offset=".55" stop-color="#FF7180"/>
      <stop offset="1" stop-color="#EF4E63"/>
    </linearGradient>
    <!-- 元素投影：低透明、大扩散，克制不脏 -->
    <filter id="lift" x="120" y="180" width="820" height="760" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1F2C55" flood-opacity=".22"/>
    </filter>
    <filter id="liftSm" x="560" y="540" width="240" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#7A1E33" flood-opacity=".34"/>
    </filter>
  </defs>
  <g transform="translate(-179.2 -179.2) scale(1.35)" filter="url(#lift)">
    <!-- 取景框四角：证件照的通用符号 -->
    <g stroke="url(#frame)" stroke-width="43" stroke-linecap="round" fill="none">
      <path d="M293 423V342C293 315 315 293 342 293H423"/>
      <path d="M601 293H682C709 293 731 315 731 342V423"/>
      <path d="M731 601V682C731 709 709 731 682 731H601"/>
      <path d="M423 731H342C315 731 293 709 293 682V601"/>
    </g>
    <g id="portrait" transform="translate(-92.16 -102.51) scale(1.18)">
    <!-- 头像剪影 -->
    <path d="M385 599C385 499 442 433 512 433C582 433 639 499 639 599C639 662 586 706 512 706C438 706 385 662 385 599Z" fill="url(#face)"/>
    <!-- 顶部高光弧：一条极淡的白弧，头像立刻有了球面反光 -->
    <path d="M424 520C441 473 473 449 512 449C551 449 583 473 600 520" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- 眼睛：一只睁开、一只眨眼（与启动页吉祥物同一套表情语言） -->
    <ellipse cx="465" cy="558" rx="18" ry="25" fill="#5A70B8"/>
    <circle cx="471" cy="549" r="6" fill="#FFFFFF" opacity=".92"/>
    <path d="M537 570C553 553 576 553 592 570" stroke="#5A70B8" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- 合规对勾徽章 -->
    <g filter="url(#liftSm)">
      <circle cx="661" cy="651" r="34" fill="url(#badge)"/>
      <path d="M648 651L658 661L677 639" stroke="#FFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    </g>
  </g>
</svg>
