name: photoid
description: 智能证件照 - 本地处理的合规证件照
publish_to: 'none'
version: 0.6.4+39

environment:
  sdk: ^3.5.0

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.3
  google_mlkit_face_detection: ^0.15.1
  http: ^1.6.0
  image: ^4.9.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  onnxruntime: ^1.4.1
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  vector_math: ^2.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 纯构建期工具（生成启动器图标），不参与运行时，故放 dev
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  # 注意：图标 PNG 不在此列——它们只是 flutter_launcher_icons 的构建输入，
  # 应用代码从不 load，列进来会白白打进包体 1.4MB
  assets:
    - assets/photo_specs.json
    - assets/models/hivision_modnet.onnx

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo/icon.png"
  # 背景用渐变图而非纯色：自适应图标在各家启动器的圆/方/水滴遮罩下
  # 都能保留品牌渐变；前景是透明底的标记，位于安全区内不会被切
  adaptive_icon_background: "logo/icon_background.png"
  adaptive_icon_foreground: "logo/icon_foreground.png"
  remove_alpha_ios: true
